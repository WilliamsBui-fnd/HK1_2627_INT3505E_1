openapi: 3.0.3
info:
  title: Books API — Lab 08
  version: 1.0.0
  description: Educational Books API for Lab 08.
  contact:
    name: Lab 08
    url: https://github.com/TrinhLK/lab08-starter
servers:
  - url: http://localhost:5000
tags:
  - name: health
    description: Service status
  - name: books
    description: Book resources
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      description: Health check of the service.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
  /books:
    get:
      operationId: listBooks
      tags: [books]
      description: List books, filter by author/year, 20 items per page.
      parameters:
        - in: query
          name: author
          schema: {type: string}
        - in: query
          name: year
          schema: {type: integer}
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: List books
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Book'}
    post:
      operationId: createBook
      tags: [books]
      description: Create a book; title and author are required.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getBook
      tags: [books]
      description: Get one book by id.
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateBook
      tags: [books]
      description: Replace all fields of a book.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteBook
      tags: [books]
      description: Delete a book.
      responses:
        '204':
          description: Deleted (response has no body)
        '404': {$ref: '#/components/responses/NotFound'}
components:
  schemas:
    Book:
      type: object
      additionalProperties: false
      required: [id, title, author, year, isbn]
      properties:
        id: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 200}
        year: {type: integer, nullable: true, minimum: 1450, maximum: 2100}
        isbn: {type: string, pattern: '^\d{13}$', nullable: true}
    BookInput:
      type: object
      additionalProperties: false
      required: [title, author]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 200}
        year: {type: integer, nullable: true, minimum: 1450, maximum: 2100}
        isbn: {type: string, pattern: '^\d{13}$', nullable: true}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    NotFound:
      description: Missing book
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Duplicate ISBN
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
